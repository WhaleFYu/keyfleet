name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: run tests
        run: python3 tests/test_fleet.py
      - name: cli smoke
        run: |
          python3 -m keyfleet.cli --help
          PYTHONPATH=. python3 -c "from keyfleet import Fleet, Endpoint; print('import ok')"
