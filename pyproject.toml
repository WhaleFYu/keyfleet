[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keyfleet-llm"
version = "0.2.0"
description = "Zero-dependency failover + spend caps for multiple OpenAI-compatible API keys"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["llm", "openai", "api-keys", "failover", "budget", "rate-limit"]
dependencies = []

[project.urls]
Homepage = "https://github.com/WhaleFYu/keyfleet"
Source = "https://github.com/WhaleFYu/keyfleet"
Changelog = "https://github.com/WhaleFYu/keyfleet/blob/main/CHANGELOG.md"

[project.scripts]
keyfleet = "keyfleet.cli:main"

[tool.setuptools]
packages = ["keyfleet"]
